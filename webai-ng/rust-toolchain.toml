# webai-ng build toolchain.
#
# Minimum supported Rust version (MSRV) is `Rust 1.87`, edition 2021
# (docs/ARCHITECTURE.md §10), enforced via `rust-version = "1.87"` in the
# workspace manifest. Building uses `stable` so the actual compiler on the
# machine is used; CI may pin a specific version via `RUSTUP_TOOLCHAIN`.

[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
