[package]
name = "webai-tui"
description = "ratatui + crossterm frontend with terminal image support (Kitty/iTerm2/Sixel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Passthrough for device-level integration tests (screenshot_render): selecting
# real_backend pulls the bridge/webkit WPE path (used by tests via cfg).
real_backend = ["dep:webai-bridge", "webai-bridge/real_backend", "dep:webai-webkit", "webai-webkit/real_ffi"]

[dependencies]
webai-protocol = { path = "../webai-protocol" }
webai-agent = { path = "../webai-agent" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
parking_lot = { workspace = true }
webai-llm = { path = "../webai-llm" }
webai-memory = { path = "../webai-memory" }
webai-bridge = { path = "../webai-bridge", optional = true }
webai-webkit = { path = "../webai-webkit", optional = true }

base64 = "0.22"
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
