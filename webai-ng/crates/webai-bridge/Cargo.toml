[package]
name = "webai-bridge"
description = "jcode_host equivalent: tool dispatch, screenshots, download, snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Passthrough enabling the real WPE FFI backend (cog + WPE WebKit C++ bridge).
# Default build stays pure Rust; `--features real_backend` compiles and links
# the legacy C++ wrapper for real-device runs (§4.7).
real_backend = ["webai-webkit/real_ffi"]

[dependencies]
webai-protocol = { path = "../webai-protocol" }
webai-script = { path = "../webai-script" }
webai-webkit = { path = "../webai-webkit" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
