[package]
name = "webai-bridge-cxx"
description = "cxx bridge bindings to cog/libwpe C++ wrappers (only crate containing C++)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
webai-protocol = { path = "../webai-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# C++ bridge bindings only when the opt-in `legacy_cpp` feature is enabled.
# With default features (no `legacy_cpp`), this crate must not link any
# system WebKit and must be compilable/testable in a pure-Rust environment
# (ARCHITECTURE.md §4.7 / §10).
cxx = { version = "1.0", optional = true }

[build-dependencies]
# Only used when `legacy_cpp` is enabled; the build.rs short-circuits
# otherwise so the default build never invokes pkg-config or cc.
cxx-build = { version = "1.0", optional = true }
cc = { version = "1.0", optional = true }
pkg-config = { version = "0.3", optional = true }

[features]
default = []
legacy_cpp = ["dep:cxx", "dep:cxx-build", "dep:cc", "dep:pkg-config"]
