# Webai CI
#
# Quality gates for the webai-ng cargo workspace per task M1-5 and
# ARCHITECTURE.md §3.2 (§3.2 "强制执行"):
#   - layered dependency partial-order enforcement script (custom, §3.2)
#   - cargo-deny: ban multiple versions + restrict sources (bans/sources)
#   - license allow-list (fail closed)
#   - a build with --no-default-features (Rust-only, must remain portable, §4.7)
#
# All gates share one job so the whole `webai-ng/` dir is covered without
# per-crate duplication. Failing fast keeps the feedback loop tight.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "webai-ng/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "webai-ng/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep the workspace root stable relative to the workflow file.
  WORKSPACE: webai-ng

jobs:
  # legacy_cpp opt-in path (task #82 / review #33 Major-2): the C++ bridge
  # build runs in a container with the WPE / WebKit dev libraries and is
  # allowed to fail independently of the default Rust-only job (§11 dual
  # path). The smoke test is feature-gated and runs with `--ignored`.
  legacy_cpp:
    name: legacy_cpp • cxx bridge build + real-device smoke
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain + WPE/WebKit dev libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            curl python3 \
            libwpewebkit-1.0-3 libwpewebkit-1.0-dev \
            libwpe-1.0-1 libwpe-1.0-dev \
            libegl1-mesa-dev
          # rustup (stable) — the container has no preinstalled Rust.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE }}

      - name: Build bridge-cxx with legacy_cpp
        run: cargo build -p webai-bridge-cxx --features legacy_cpp

      - name: Unit tests (legacy_cpp)
        run: cargo test -p webai-bridge-cxx --features legacy_cpp

      # Real-device smoke: launch + evaluate the minimal path against the
      # actual WPE backend inside this container. `--ignored` gates it away
      # from the default (FFI-less) runs.
      - name: Real-device smoke test (--ignored)
        run: cargo test -p webai-bridge-cxx --features legacy_cpp --test real_device_smoke -- --ignored --nocapture

      # T2/T3 real-device e2e matrix + reuse case (#103/#104/#106 via #107):
      # the WPE-backed 21-case matrix, the full pipeline, and the FR-3 reuse
      # chain, each `--ignored`-gated and run as separate processes (cog
      # allows one initialization per process). Headless rendering via
      # xvfb-run + WPE_BACKEND=fdo, matching ci/wpe.Dockerfile.
      - name: Real-device e2e matrix T2/T3 (--ignored, headless WPE)
        run: |
          export WPE_BACKEND=fdo
          xvfb-run -a cargo test -p webai-bridge --features real_backend --test real_device_matrix -- --ignored --exact real_device_matrix_21_cases --nocapture
          xvfb-run -a cargo test -p webai-bridge --features real_backend --test real_device_matrix -- --ignored --exact real_device_reuse_on_matrix_chain --nocapture
          xvfb-run -a cargo test -p webai-bridge --features real_backend --test real_device_e2e -- --ignored --nocapture

  ci:
    name: layering • deny • no-default-features
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Reuse a shared cargo cache to keep dependency fetches fast.
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE }}

      # Rust-only build: no `legacy_cpp` features, must compile and pass tests
      # on a machine with no WebKit/system C++ (ARCHITECTURE.md §4.7 / §10).
      - name: Build with --no-default-features
        run: cargo build --workspace --no-default-features

      # e2e matrix, stub layer (#103/#107): the 21-case N-S1..N-SN2 plan runs
      # deterministically on the fake backend in every default job run. The
      # MATRIX-STUB line is the per-run pass-rate ledger for M-1.
      - name: e2e matrix, stub layer (21 cases + ledger)
        run: |
          cargo test -p webai-bridge --test matrix_stub -- --nocapture | tee stub-matrix.log
          grep -q "MATRIX-STUB: 21/21" stub-matrix.log

      # Layered dependency partial-order enforcement (ARCHITECTURE.md §3.2).
      # Written in stdlib-only Python so it needs no extra toolchain.
      - name: Check crate layering (partial order §3.2)
        run: python3 scripts/check-dep-layers.py --workspace .

      # cargo-deny: bans (multiple versions), sources (crates.io only), licenses
      # (allow-list). Advisories are intentionally not part of this job; M1-5 is
      # scoped to ARCHITECTURE.md §3.2 enforcement (bans/sources/layering).
      # Use default features (Rust-only, no opt-in C++ `legacy_cpp`): aligns with
      # §4.7, which guarantees the portable Rust-only graph, not the C++ one.
      - name: cargo-deny (bans / sources / licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: webai-ng/Cargo.toml
          arguments: --no-default-features
          command-arguments: bans licenses sources

  # Benchmark fixtures (PRODUCT-DESIGN.md §6 M-6): build artifacts must
  # include the fixed fixture pages so perf and e2e jobs reference the same
  # shipped files instead of ad-hoc pages.
  fixtures:
    name: fixture pages (M-6 benchmark fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fixture contract tests (node budgets, tracking)
        run: cargo test -p webai-protocol --test fixture_pages
        defaults:
          run:
            working-directory: ${{ env.WORKSPACE }}

      - name: Upload fixture pages as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-fixtures
          path: |
            webai-ng/fixtures/pages/static.html
            webai-ng/fixtures/pages/spa.html
            webai-ng/fixtures/pages/items.json
          if-no-files-found: error

